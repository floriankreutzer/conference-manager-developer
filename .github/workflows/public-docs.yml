name: Public documentation safety

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Require matching Jira key in PR title and branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_TITLE" =~ ^(CO-[1-9][0-9]*)[[:space:]]+[^[:space:]] ]]; then
            echo "::error title=Missing Jira work item key::PR title must start with CO-123 followed by a descriptive title."
            exit 1
          fi
          TITLE_KEY="${BASH_REMATCH[1]}"

          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "Dependabot branch naming is provider-controlled; Jira traceability is enforced through PR key $TITLE_KEY."
            exit 0
          fi

          if [[ ! "$HEAD_REF" =~ (^|[/_-])(CO-[1-9][0-9]*)([/_-]|$) ]]; then
            echo "::error title=Missing Jira branch key::Branch name must contain the PR Jira key, for example CO-123-short-description or feature/CO-123-short-description."
            exit 1
          fi
          BRANCH_KEY="${BASH_REMATCH[2]}"
          if [[ "$BRANCH_KEY" != "$TITLE_KEY" ]]; then
            echo "::error title=Jira key mismatch::Branch key $BRANCH_KEY must match PR key $TITLE_KEY."
            exit 1
          fi
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject sensitive file types and obvious private material
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo 'Sensitive file type detected.'
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude='public-docs.yml' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~+/-]{16,})' .; then
            echo 'Potential credential/private material detected.'
            exit 1
          fi

      - name: Enforce OpenAPI publication provenance
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          specs=(openapi/**/*.yaml openapi/**/*.yml openapi/**/*.json)
          for spec in "${specs[@]}"; do
            grep -Eq '^x-conference-manager-source-commit:' "$spec" || {
              echo "$spec is missing x-conference-manager-source-commit"
              exit 1
            }
            grep -Eq '^x-conference-manager-contract-version:' "$spec" || {
              echo "$spec is missing x-conference-manager-contract-version"
              exit 1
            }
          done

      - name: Check repository-local Markdown links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          errors=[]
          for p in Path('.').rglob('*.md'):
              if '.git' in p.parts:
                  continue
              text=p.read_text(encoding='utf-8')
              for target in re.findall(r'\[[^\]]+\]\(([^)]+)\)', text):
                  if target.startswith(('http://','https://','mailto:','#')):
                      continue
                  clean=target.split('#',1)[0]
                  if not clean:
                      continue
                  dest=(p.parent/clean).resolve()
                  if not dest.exists():
                      errors.append(f'{p}: missing local link {target}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY
